# Hermes 配置文件 - 废水监测系统主智能体
#
# 这是主智能体的配置，位于 E:\project\Ecological_env\workspace
#
# 启动 Hermes 时需要设置 HERMES_HOME 指向此目录：
# set HERMES_HOME=E:\project\Ecological_env\workspace

# =============================================================================
# 模型配置
# =============================================================================
model:
  base_url: "http://172.16.12.41:30000/v1"
  default: "ctgu-vlm"
  provider: "openai-api"

providers:
  openai-api:
    api_key: "sk-4e9a2c7d5f1b8e3c6d0a9b2f4d7e1c3a6b5f8e2d9c7a1b0f"
    base_url: "http://172.16.12.41:30000/v1"

fallback_providers: []

# =============================================================================
# 智能体配置
# =============================================================================
agent:
  max_turns: 60
  gateway_timeout: 1800
  reasoning_effort: medium
  tool_use_enforcement: auto

# =============================================================================
# 技能配置 - 主智能体编排技能
# =============================================================================
skills:
  external_dirs:
    - skills/orchestrator-core
  template_vars: true
  inline_shell: false

# =============================================================================
# API Server 配置
# =============================================================================
platforms:
  api_server:
    enabled: true
    extra:
      port: 8642
      host: 127.0.0.1

# =============================================================================
# 日志配置
# =============================================================================
logging:
  level: INFO
