version: '3.8'

services:
  # ========== 项目服务 ==========

  # Web 界面
  web:
    build: .
    command: python -m middleware.web_interface
    ports:
      - "8080:8080"
    environment:
      - WEB_PORT=8080
    volumes:
      - ./data:/app/data
      - ./middleware/static:/app/middleware/static
    depends_on:
      - query
      - monitor
    restart: unless-stopped
    networks:
      - eco-net

  # 查询接口
  query:
    build: .
    command: python middleware/query_interface.py
    ports:
      - "5001:5001"
    environment:
      - QUERY_PORT=5001
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    networks:
      - eco-net

  # 监控服务（含 Prometheus 指标暴露）
  monitor:
    build: .
    command: python middleware/app_orchestrator.py
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    networks:
      - eco-net

  # 数据流服务（可选，用于发送模拟数据）
  stream:
    build: .
    command: python stream/dual_data_stream.py
    volumes:
      - ./data:/app/data
    depends_on:
      - monitor
    restart: unless-stopped
    networks:
      - eco-net

  # ========== 监控服务 ==========

  # Prometheus
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    networks:
      - eco-net

  # Grafana
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - eco-net

networks:
  eco-net:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
