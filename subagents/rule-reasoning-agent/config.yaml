# 规则推理子智能体规则配置
# 定义违规判定规则和推理逻辑

# ============================================
# 规则元数据 (Rule Metadata)
# ============================================
metadata:
  # 规则配置版本
  version: "1.0.0"
  last_updated: "2026-06-01"

  # 可疑度等级定义 (Suspicion Level Scale)
  # 用于统一量化违规行为的严重程度
  suspicion_levels:
    low:
      value: 1
      description: "低可疑度 - 数据异常但可能为正常波动，需持续观察"
      action: "monitor"
    medium:
      value: 2
      description: "中可疑度 - 存在明显异常，需进一步核查"
      action: "investigate"
    high:
      value: 3
      description: "高可疑度 - 数据模式强烈暗示人为干预，需立即调查"
      action: "alert"
    serious:
      value: 4
      description: "严重可疑度 - 典型违规特征，高度疑似恶意行为，需紧急处置"
      action: "urgent"

  # 有效条件类型 (Valid Condition Types)
  # 所有规则条件中的 type 字段必须使用以下预定义值
  valid_condition_types:
    - anomaly_match           # 异常类型匹配
    - equipment_check          # 设备状态检查
    - multi_indicator_sync    # 多指标同步检查
    - removal_rate_check       # 去除率检查
    - flow_check               # 流量检查
    - data_missing_rate        # 数据缺失率检查
    - off_hours_check          # 非工作时间检查
    - equipment_status         # 设备状态（过滤用）
    - maintenance_record       # 维护记录（过滤用）
    - process_check            # 工艺阶段检查（过滤用）
    - time_check               # 时长检查（过滤用）

  # 时间单位约定 (Time Unit Convention)
  # 所有涉及时间的字段均使用以下标准单位后缀
  time_units:
    h: "小时 (hours) - 标准时间单位，用于时长、间隔等"
    m: "分钟 (minutes) - 用于较短时长"
    s: "秒 (seconds) - 用于精确时长"
    d: "天 (days) - 用于长期统计"
  convention: "数值+单位后缀，例如: 2h, 30m, 90s, 7d"

# ============================================
# 违规检测规则 (Violation Detection Rules)
# ============================================
rules:
  # 插瓶干扰规则
  bottle_interference:
    id: bottle_interference
    name: 插瓶干扰
    enabled: true
    suspicion_level: high
    conditions:
      - type: anomaly_match
        anomaly_type: 平稳异常
        min_duration: 2h
        max_std_dev: 0.1
      - type: equipment_check
        equipment_status: running
        not_in_maintenance: true
    reasoning: "数据恒定但设备正常运行，疑似插瓶干扰"
    legal_reference: "HJ 915-2017 第X条"

  # 人工拟合规则
  artificial_fitting:
    id: artificial_fitting
    name: 人工拟合
    enabled: true
    suspicion_level: high
    conditions:
      - type: anomaly_match
        anomaly_type: 平稳异常
        max_r_squared: 0.99
        min_variance_ratio: 0.1
    reasoning: "数据过度平滑，分布异常，疑似人工拟合"
    legal_reference: "HJ 915-2017 第X条"

  # 稀释排放规则
  dilution_discharge:
    id: dilution_discharge
    name: 稀释排放
    enabled: true
    suspicion_level: serious
    conditions:
      - type: multi_indicator_sync
        indicators: ["COD", "TN", "TP", "NH3_N"]
        min_sync_drop_ratio: 0.5
      - type: removal_rate_check
        min_removal_rate: 0.95
        max_removal_rate: 1.0
      - type: flow_check
        flow_increase_threshold: 1.5
    reasoning: "多指标同步下降且去除率异常，疑似稀释排放"
    legal_reference: "水污染防治法 第XX条"

  # 恶意逃避规则
  malicious_evasion:
    id: malicious_evasion
    name: 恶意逃避
    enabled: true
    suspicion_level: serious
    conditions:
      - type: data_missing_rate
        min_missing_rate: 0.2
      - type: off_hours_check
        off_hours_only: true
        hours: [22, 23, 0, 1, 2, 3, 4, 5, 6]
    reasoning: "工作时间外数据缺失，疑似恶意逃避"
    legal_reference: "HJ 915-2017 第X条"

# ============================================
# 误报过滤规则 (False Positive Filters)
# ============================================
false_positive_filters:
  # 设备停运过滤
  equipment_shutdown:
    id: equipment_shutdown
    enabled: true
    filter_reason: "设备依法停运检修"
    conditions:
      - type: equipment_status
        status: shutdown
      - type: maintenance_record
        has_record: true

  # 反冲洗过滤
  backwash_filter:
    id: backwash_filter
    enabled: true
    filter_reason: "反冲洗期间正常数据波动"
    conditions:
      - type: process_check
        process_stage: backwash
      - type: time_check
        max_duration: 1h

# ============================================
# 优先级配置 (Priority Configuration)
# ============================================
# 规则执行优先级，按顺序从高到低处理
priority:
  - malicious_evasion
  - dilution_discharge
  - bottle_interference
  - artificial_fitting
