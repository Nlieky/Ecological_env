# 异常检测子智能体配置文件

agent:
  id: anomaly-detection-agent
  version: 1.0.0
  name: 异常检测子智能体

# 算子选择配置
operator_selection:
  # 样本量阈值
  small_sample_threshold: 1000
  medium_sample_threshold: 10000

  # 自相关阈值
  autocorr_threshold: 0.3

  # 周期检测阈值
  periodogram_threshold: 0.1

  # 高维度阈值
  high_dim_threshold: 50

# 孤立森林参数
isolation_forest:
  contamination: 0.1  # 污染率，专利要求值
  contamination_range: [0.05, 0.20]  # 取值范围
  n_estimators: 100
  max_samples: "auto"
  random_state: 42

# LSTM自编码器参数
lstm_ae:
  epochs: 50
  batch_size: 32
  sequence_length: 10
  latent_dim: 8
  reconstruction_threshold_percentile: 95  # 重构误差95%分位数

# IQR方法参数
iqr:
  coefficient: 1.5  # IQR系数

# 3σ方法参数
three_sigma:
  threshold: 3  # 3倍标准差

# 异常评分配置
scoring:
  anomaly_threshold: 0.5  # 孤立森林异常分数阈值，专利要求值

# 异常模式识别配置
pattern_recognition:
  similarity_threshold: 0.7  # 模式相似度阈值，专利要求值

  # 平稳异常特征阈值
  stable_std_threshold: 0.5
  stable_cv_threshold: 0.1

  # 突变异常特征阈值
  change_magnitude_threshold: 3.0

  # 趋势异常特征阈值
  trend_second_derivative_threshold: 0.01

  # 高频波动阈值
  high_freq_window_minutes: 5
  high_freq_change_threshold: 2.0

# 置信度评估配置
confidence:
  anomaly_score_weight: 0.6  # 异常分数权重，专利要求值
  pattern_similarity_weight: 0.4  # 模式相似度权重，专利要求值

# 违规模式特征库
violation_patterns:
  - name: "插瓶干扰模式"
    type: "bottle_substitution"
    description: "pH标准差低而COD标准差高"

  - name: "稀释排放模式"
    type: "dilution_discharge"
    description: "去除率偏差大，趋势或突变异常"

  - name: "人工拟合模式"
    type: "artificial_fitting"
    description: "工况无变化但数据均匀上升或下降"

  - name: "恶意逃避模式"
    type: "malicious_evasion"
    description: "排放数据正常但申报停产"

# 异常特征定义库
anomaly_features:
  - name: "平稳异常特征"
    type: "stable"
    description: "监测指标在预设时间窗口内标准差或变异系数低于预设阈值"

  - name: "突变异常特征"
    type: "sudden_change"
    description: "监测指标在相邻时间点的变化幅度超过预设阈值"

  - name: "趋势异常特征"
    type: "trend"
    description: "监测指标呈现单向均匀上升或均匀下降，二阶导数接近零"

  - name: "周期异常特征"
    type: "periodic"
    description: "通过傅里叶变换检测到显著的周期性成分"

  - name: "高频波动异常特征"
    type: "high_frequency"
    description: "在分钟级时间尺度上出现突升突降、异常归零"
