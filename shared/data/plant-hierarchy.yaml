# 市 → 厂区 → 厂(监测点) 层级配置
# 厂名必须与 InfluxDB 里 plant_id tag 完全一致(即 xls 报表解析出的厂名)。
# 有数据但未列在此的厂自动落"未分组"；列了但没数据的厂显示为离线(预登记)。
当阳市:
  城东厂区:
    - 当阳市金桥污水处理厂一期
枝江市:
  宜昌长航绿色航运环保发展有限公司:
    - 洗舱站污水排放口

# ── 报表文件名 → plant_id 显式映射 ─────────────────────────────
# 命名不规范的报表在这里登记(文件名主体=去掉"数据报表"后缀):
# 默认启发式会剥掉进出水关键词,监测点名本身含"排放口"的会被剥残。
report_name_map:
  "洗舱站污水排放口": "洗舱站污水排放口"

# ── per-plant 覆盖配置(可选;未列出的厂用默认) ──────────────────
# limits: 出水限值(超限判定);display_name: 树/看板显示名
plant_configs:
  当阳市金桥污水处理厂一期:
    display_name: 金桥污水处理厂一期
    type: 市政污水处理
  洗舱站污水排放口:
    display_name: 宜昌长航绿色航运(洗舱站)
    type: 船舶洗舱废水
    company: 枝江市宜昌长航绿色航运环保发展有限公司

# ── 厂名别名 → plant_id（智能体解析用户口语厂名用；页面可管理）──────────────
# 子智能体自愈入口(subagent_entry)优先读本段,无此段时用内置两厂默认(向后兼容)。
# 别名值必须与 InfluxDB plant_id 完全一致(=层级树里的厂名)。
plant_aliases:
  "金桥": "当阳市金桥污水处理厂一期"
  "洗舱站": "洗舱站污水排放口"
