# 专利参数配置文件
# 基于发明专利《一种多智能体协同的废水虚假排放智能监测方法及系统》
#
# 说明：
# - 本配置文件提供了专利中描述的核心参数作为参考基准
# - 专利只提供思路和框架，具体实施可以根据实际需求调整
# - 这些参数可以根据业务场景、监管要求、技术条件进行优化
# - 建议定期根据实际运行数据调优参数

# ========== 结果复用三重判决参数 ==========
result_reuse:
  # 数据匹配判决参数
  jaccard_threshold: 0.7          # Jaccard相似系数阈值 M≥0.7
  time_overlap_threshold: 0.5     # 时间重叠度阈值 ≥0.5

  # 新鲜度判决参数（秒）
  freshness_windows:
    data_governance: 3600         # 数据治理缓存1小时
    feature_analysis: 3600        # 特征分析缓存1小时
    anomaly_detection: 1800       # 异常检测缓存30分钟
    rule_reasoning: 7200          # 规则推理缓存2小时

  # 语义匹配判决参数
  semantic_threshold: 0.8         # 编辑距离相似度阈值 S≥0.8

# ========== 异常检测参数 ==========
anomaly_detection:
  # 5类异常特征阈值
  patterns:
    # 平稳异常（恒定异常）
    constant:
      min_duration_hours: 2       # 恒定最小持续时长
      variance_threshold: 0.01    # 方差阈值

    # 突变异常
    spike:
      window_size: 5              # 突变检测窗口
      threshold_multiplier: 3     # 阈值倍数

    # 趋势异常
    trend:
      window_size: 20             # 趋势检测窗口
      slope_threshold: 0.05       # 斜率阈值

    # 周期异常（专利新增）
    periodic:
      window_size: 48             # 周期检测窗口
      power_ratio_threshold: 5    # 功率谱比值阈值
      common_periods: [6, 8, 12, 24]  # 常见不自然周期（小时）

    # 高频波动异常（专利新增）
    high_freq_volatility:
      window_size: 20             # 高频波动检测窗口
      sign_change_ratio: 0.6      # 符号变化比例阈值

  # 异常评分阈值
  severity_thresholds:
    critical: 0.9                 # 严重异常阈值
    high: 0.7                     # 高度异常阈值
    medium: 0.5                   # 中度异常阈值
    low: 0.3                      # 低度异常阈值

# ========== 违规模式检测参数 ==========
violation_detection:
  # 插瓶干扰
  bottle_interference:
    proximity_ratio: 0.8          # 接近标准限值的比例（80%-100%）
    min_constant_duration: 2      # 最小恒定时长（小时）
    multi_indicator_threshold: 2  # 多指标恒定判定阈值

  # 人工拟合
  artificial_fitting:
    smoothness_threshold: 0.3     # 平滑度阈值（差分标准差/序列标准差）
    r_squared_threshold: 0.95     # 数学拟合R²阈值

  # 稀释排放
  dilution_discharge:
    declining_ratio: 0.6          # 下降指标比例阈值（60%）
    low_level_ratio: 0.5          # 低位指标比例阈值（低于历史中位数50%）
    trend_slope_threshold: -0.1   # 趋势斜率阈值

  # 恶意逃避
  malicious_evasion:
    missing_rate_threshold: 0.2   # 缺失率阈值（20%）
    night_day_ratio: 2            # 夜间/日间缺失率比值
    night_hours_start: 22         # 夜间开始时间
    night_hours_end: 6            # 夜间结束时间

# ========== 工艺机理校验参数 ==========
process_validation:
  # pH-COD协同规则
  ph_cod:
    min_correlation: 0.3          # pH-COD最小相关系数
    max_negative_correlation: -0.5 # 最大负相关阈值（异常判定）

  # 氨氮-总氮转化规则（专利新增）
  nitrogen_conversion:
    min_correlation: 0.3          # 氨氮-总氮最小相关系数
    nh3_tn_ratio_min: 0.2         # 出水氨氮/总氮比值下限（20%）
    nh3_tn_ratio_max: 0.6         # 出水氨氮/总氮比值上限（60%）

    # 去除率范围
    nh3_removal_min: 0.7          # 氨氮最小去除率（70%）
    nh3_removal_max: 0.95         # 氨氮最大去除率（95%）
    tn_removal_min: 0.6           # 总氮最小去除率（60%）
    tn_removal_max: 0.85          # 总氮最大去除率（85%）

    # 氨氮指标名称（用于识别）
    nh3_indicators: ["NH3-N", "氨氮", "AN", "NH3"]
    tn_indicators: ["TN", "总氮"]

  # 质量平衡规则
  mass_balance:
    min_removal_rate: 0.4         # 最小去除率（40%）
    max_removal_rate: 0.95        # 最大去除率（95%）
    effluent_should_be_lower: true # 出水应低于进水

# ========== 排放标准限值（GB 18918-2002） ==========
standard_limits:
  # 一级A标
  grade_1a:
    COD: 50                       # 化学需氧量 (mg/L)
    TN: 15                        # 总氮 (mg/L)
    NH3_N: 5                      # 氨氮 (mg/L, 水温>12℃)
    TP: 0.5                       # 总磷 (mg/L)
    pH: [6, 9]                    # pH范围
    SS: 10                        # 悬浮物 (mg/L)
    BOD5: 10                      # 五日生化需氧量 (mg/L)

  # 一级B标
  grade_1b:
    COD: 60
    TN: 20
    NH3_N: 8
    TP: 1
    pH: [6, 9]
    SS: 20
    BOD5: 20

  # 二级标准
  grade_2:
    COD: 100
    TN: None                      # 无要求
    NH3_N: 25
    TP: 3
    pH: [6, 9]
    SS: 30
    BOD5: 30

# ========== 主智能体参数 ==========
master_agent:
  # 意图识别参数
  intent_confidence_threshold: 0.85  # 意图识别置信度阈值 ≥0.85

  # 任务分解参数
  task_decomposition:
    max_parallel_tasks: 10        # 最大并行任务数
    priority_range: [1, 10]       # 优先级范围

  # 自适应优化参数
  adaptive_learning:
    feedback_learning_rate: 0.1   # 反馈学习率
    rule_update_threshold: 5      # 规则更新阈值（样本数）

# ========== 系统运行参数 ==========
system:
  # 监测频率
  monitoring_interval: 600        # 主动监测间隔（秒，10分钟）

  # 缓存配置
  cache:
    max_size: 1000                # 最大缓存条目数
    ttl: 86400                    # 默认缓存过期时间（秒，24小时）

  # 日志配置
  logging:
    level: "INFO"                 # 日志级别
    format: "detailed"            # 日志格式

# ========== 版本信息 ==========
version:
  patent_name: "一种多智能体协同的废水虚假排放智能监测方法及系统"
  config_version: "1.0.0"
  last_updated: "2026-06-02"

