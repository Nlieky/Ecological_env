# 子智能体注册表
# 定义所有可用的子智能体及其能力描述

agents:
  # 多维数据感知智能体
  multi-dimensional-data-perception:
    id: multi-dimensional-data-perception-agent
    name: 多维数据感知子智能体
    emoji: "📊"
    capabilities:
      - multi_source_data_acquisition
      - data_decomposition
      - time_alignment
      - data_cleaning
      - standardization
    data_types:
      - water_quality
      - flow
      - equipment_status
      - process_parameters
      - maintenance_records
      - production_records
      - source_info
      - monitoring_point_info
    script_path: subagents/multi-dimensional-data-perception-agent/skills/data-perception-core/scripts/
    identity_files:
      - IDENTITY.md
      - AGENTS.md
      - SOUL.md
      - MEMORY.md

  # 异常检测子智能体
  anomaly-detection:
    id: anomaly-detection-agent
    name: 异常检测子智能体
    emoji: "🔍"
    capabilities:
      - statistical_anomaly_detection
      - ml_anomaly_detection
      - deep_learning_anomaly_detection
      - specialized_pattern_detection
    anomaly_types:
      - stationary
      - change_point
      - trend
      - periodic
      - high_frequency_fluctuation
    script_path: subagents/anomaly-detection-agent/skills/anomaly-detection-core/scripts/
    identity_files:
      - IDENTITY.md
      - AGENTS.md
      - SOUL.md
      - MEMORY.md

  # 规则推理子智能体
  rule-reasoning:
    id: rule-reasoning-agent
    name: 规则推理子智能体
    emoji: "⚖️"
    capabilities:
      - rule_matching
      - process_validation
      - expert_reasoning
      - violation_detection
      - false_positive_filtering
    violation_types:
      - bottle_interference
      - artificial_fitting
      - dilution_discharge
      - malicious_evasion
    script_path: subagents/rule-reasoning-agent/skills/rule-reasoning-core/scripts/
    identity_files:
      - IDENTITY.md
      - AGENTS.md
      - SOUL.md
      - MEMORY.md

  # 研判预警与处置执行智能体
  disposition-execution:
    id: disposition-execution-agent
    name: 研判预警与处置执行子智能体
    emoji: "🚨"
    capabilities:
      - consensus_fusion
      - alert_classification
      - work_order_generation
      - action_execution
    alert_levels:
      - general
      - moderate
      - serious
    script_path: subagents/disposition-execution-agent/skills/disposition-execution-core/scripts/
    identity_files:
      - IDENTITY.md
      - AGENTS.md
      - SOUL.md
      - MEMORY.md

# 任务类型与智能体映射
task_type_mapping:
  violation_detection:
    - multi-dimensional-data-perception
    - anomaly-detection
    - rule-reasoning
    - disposition-execution
  analysis_query:
    - multi-dimensional-data-perception
    - anomaly-detection
  historical_review:
    - multi-dimensional-data-perception
    - rule-reasoning
  alert_response:
    - disposition-execution

# 执行模式
execution_modes:
  sequential: 按顺序执行子智能体
  parallel: 并行执行独立子智能体
  hybrid: 混合执行模式
