# 融合共识算法配置
consensus_engine:
  # 基础权重
  base_weights:
    anomaly: 0.5  # 异常检测权重
    violation: 0.5  # 规则推理权重

  # 场景配置
  scenes:
    default:
      weights:
        anomaly: 0.5
        violation: 0.5
      priority: "balanced"
      description: "默认场景，均衡两种结果"

    critical:
      weights:
        anomaly: 0.3
        violation: 0.7
      priority: "violation_first"
      description: "关键场景，优先规则推理"

    normal:
      weights:
        anomaly: 0.7
        violation: 0.3
      priority: "anomaly_first"
      description: "正常场景，优先异常检测"

  # 动态调整参数
  adaptation:
    confidence_threshold: 0.3  # 置信度差异阈值
    max_weight_adjustment: 0.2  # 最大权重调整幅度

  # 特殊情况处理
  special_cases:
    high_confidence_both:
      threshold: 0.9
      boost: 0.1
    low_confidence_both:
      threshold: 0.3
      penalty: 0.1
