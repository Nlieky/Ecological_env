# 废水虚假排放智能监测系统 - 统一配置文件
# 版本: v2.1.0
# 创建日期: 2026-05-15

# ========== 系统基础信息 ==========
system:
  name: "废水虚假排放智能监测系统"
  version: "2.1.0"
  environment: "development"  # development, testing, production
  description: "一种多智能体协同的废水虚假排放智能监测方法及系统"

# ========== 主智能体配置 ==========
master_agent:
  enabled: true
  class: "MasterAgentLayer"
  module: "master_agent_layer"
  version: "2.1.0"

  # 结果复用配置
  result_reuse:
    enabled: true
    jaccard_threshold: 0.7
    semantic_threshold: 0.8
    time_overlap_threshold: 0.5
    max_cache_size: 1000
    cache_ttl: 3600

  # 任务处理配置
  task_processing:
    max_concurrent_tasks: 10
    task_timeout: 300
    priority_range: [1, 10]

  # LLM配置
  llm:
    model: "claude-opus-4-7"
    temperature: 0.0
    max_tokens: 4096
    timeout: 30

# ========== 任务编排层配置 ==========
task_orchestration:
  enabled: true
  version: "2.0.0"

  # 并发控制
  concurrency:
    max_parallel_tasks: 5
    max_sequential_tasks: 10

  # 超时配置
  timeout:
    default: 30
    data_governance: 30
    feature_analysis: 30
    anomaly_detection: 60
    rule_reasoning: 30

  # 重试策略
  retry:
    max_retries: 3
    backoff_factor: 2
    retry_on_timeout: true
    retry_on_error: false

# ========== 子智能体配置（新架构）==========
subagents:
  # 多维数据感知子智能体
  multi_dimensional_data_perception_agent:
    id: "multi-dimensional-data-perception-agent"
    name: "多维数据感知子智能体"
    class: "MultiDimensionalDataPerceptionAgent"
    enabled: true
    priority: 1
    timeout: 30
    version: "2.0.0"

    config:
      # 数据源配置
      data_sources:
        csv:
          enabled: true
          path: "data/"
          encoding: "utf-8"
        api:
          enabled: false
          base_url: ""
          timeout: 30

      # 数据处理配置
      processing:
        max_data_size: 1000000
        batch_size: 1000
        time_alignment_enabled: true
        cleaning_enabled: true
        standardization_enabled: true
        data_decomposition_enabled: true

  # 异常检测子智能体（包含特征分析）
  anomaly_detection_agent:
    id: "anomaly-detection-agent"
    name: "异常检测子智能体"
    class: "AnomalyDetectionAgent"
    enabled: true
    priority: 3
    timeout: 60
    version: "2.0.0"

    config:
      # 算法配置
      algorithms:
        isolation_forest:
          enabled: true
          contamination: 0.1
        one_class_svm:
          enabled: true
          nu: 0.1
        local_outlier_factor:
          enabled: false

      # 异常特征配置
      patterns:
        constant:
          enabled: true
          min_duration_hours: 2
        spike:
          enabled: true
          threshold_multiplier: 3
        trend:
          enabled: true
          slope_threshold: 0.05
        periodic:
          enabled: true
          window_size: 48
          power_ratio_threshold: 5
        high_freq_volatility:
          enabled: true
          window_size: 20
          sign_change_ratio: 0.6

      # 违规模式配置
      violations:
        bottle_interference:
          enabled: true
          proximity_ratio: 0.8
        artificial_fitting:
          enabled: true
          smoothness_threshold: 0.3
        dilution_discharge:
          enabled: true
          declining_ratio: 0.6
        malicious_evasion:
          enabled: true
          missing_rate_threshold: 0.2

      # 阈值配置
      thresholds:
        critical: 0.9
        high: 0.7
        medium: 0.5
        low: 0.3

  # 规则推理子智能体
  rule_reasoning_agent:
    id: "rule-reasoning-agent"
    name: "规则推理子智能体"
    class: "RuleReasoningAgent"
    enabled: true
    priority: 4
    timeout: 30
    version: "2.0.0"

    config:
      # 法规规则配置
      regulations:
        enabled: true
        sources:
          - "水污染防治法"
          - "GB 18918-2002"
          - "HJ 915-2017"

      # 工艺机理配置
      process_mechanism:
        enabled: true
        ph_cod_correlation:
          min_correlation: 0.3
        nitrogen_conversion:
          min_correlation: 0.3
          nh3_tn_ratio_min: 0.2
          nh3_tn_ratio_max: 0.6

      # 专家经验配置
      expert_experience:
        enabled: true
        similarity_threshold: 0.8

# ========== 数据源配置 ==========
data_sources:
  csv:
    enabled: true
    path: "data/"
    files:
      influent: "pollution_water_in.csv"
      effluent: "pollution_water_out.csv"
    encoding: "utf-8"

  api:
    enabled: false
    base_url: ""
    timeout: 30
    headers: {}

  stream:
    enabled: true
    type: "dual"
    port: 5000
    endpoint: "/api/dual-stream"

# ========== 缓存配置 ==========
cache:
  type: "file"  # file, redis, memory
  file:
    path: "shared/cache/"
    max_size_mb: 1024
    ttl: 3600

  redis:
    enabled: false
    host: "localhost"
    port: 6379
    db: 0
    password: ""

  memory:
    enabled: false
    max_items: 1000

# ========== 日志配置 ==========
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  format: "detailed"  # simple, detailed, json

  file:
    enabled: true
    path: "logs/"
    rotation: "daily"  # daily, weekly, size
    max_size_mb: 100
    backup_count: 30

  console:
    enabled: true
    level: "INFO"

# ========== 监控配置 ==========
monitoring:
  prometheus:
    enabled: true
    port: 9090
    scrape_interval: 5

  grafana:
    enabled: true
    port: 3000
    dashboard_path: "grafana/dashboards/"

# ========== 状态管理配置 ==========
state_management:
  enabled: true
  persistence:
    enabled: true
    path: "shared/state/"
    interval: 300  # 5分钟

  sync:
    heartbeat_interval: 30
    timeout_threshold: 90

# ========== API配置 ==========
api:
  enabled: true
  host: "0.0.0.0"
  port: 5000
  debug: false

  endpoints:
    health: "/health"
    metrics: "/metrics"
    data_stream: "/api/dual-stream"
    state: "/api/state"

# ========== 外部服务配置 ==========
external_services:
  llm:
    provider: "anthropic"
    api_key_env: "ANTHROPIC_API_KEY"
    base_url: "https://api.anthropic.com"
    model: "claude-opus-4-7"

  notification:
    enabled: false
    type: "webhook"  # webhook, email, sms
    url: ""
    timeout: 10

# ========== 开发配置 ==========
development:
  debug_mode: true
  auto_reload: false
  mock_data: true
  verbose_logging: true

# ========== 测试配置 ==========
testing:
  enabled: false
  test_data_path: "tests/fixtures/"
  coverage_target: 80

# ========== 生产配置（覆盖） ==========
production:
  debug_mode: false
  auto_reload: false
  mock_data: false
  verbose_logging: false
