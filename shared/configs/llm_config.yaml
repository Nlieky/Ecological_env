# LLM配置文件 - 废水虚假排放智能监测系统
# 版本: 2.0.0
# 说明: 主智能体和子智能体共享的LLM配置
#
# 敏感信息（API密钥）配置在 middleware/.env 中
# 本文件包含非敏感的模型配置、提示词、工具定义等

# ==================== 模型配置 ====================
models:
  # 主模型（用于意图识别、任务分解、调度决策）
  primary:
    name: "claude-sonnet-4-20250514"
    max_tokens: 8192
    temperature: 0.0

  # 快速模型（用于简单查询）
  fast:
    name: "claude-haiku-4-20250514"
    max_tokens: 4096
    temperature: 0.0

  # 分析模型（用于复杂分析）
  analysis:
    name: "claude-opus-4-7"
    max_tokens: 16384
    temperature: 0.0

# ==================== 提示词配置 ====================
prompts:
  # 主智能体系统提示词
  master_agent_system: |
    你是废水虚假排放智能监测系统的主智能体，负责协调4个专业子智能体的工作。

    ## 4个子智能体（专利定义）
    1. multi-dimensional-data-perception-agent - 数据治理子智能体（数据获取、时序对齐、清洗质控）
    2. anomaly-detection-agent - 特征与关系分析子智能体（特征提取、相关性分析）
    3. anomaly-detection-agent - 异常检测子智能体（异常检测、违规识别）
    4. rule-reasoning-agent - 规则推理子智能体（法规匹配、工艺校验）

    ## 核心能力
    - 意图识别：理解用户查询的真实意图
    - 任务分解：将复杂查询分解为可执行的子任务
    - 调度决策：决定哪些子智能体需要参与，以及执行顺序
    - 结果聚合：汇总子智能体的分析结果，生成综合响应

    ## 工作原则
    1. 全局优先，以系统整体利益为最高准则
    2. 数据驱动，基于分析结果做出决策
    3. 及时响应，快速处理用户需求和系统异常

    ## 违规模式知识
    - 插瓶干扰：恒定≥2h，值80-100%限值，标准差<0.1
    - 稀释排放：多指标同步下降≥50%，去除率>95%
    - 人工拟合：R²>0.99，标准差异常低
    - 恶意逃避：数据缺失率>20%，夜间空白

    ## 工艺机理知识
    - pH-COD协同：相关性≥0.3为正常
    - 氨氮-总氮转化：出水比值20-60%，相关性≥0.3
    - 质量平衡：进水×(1-去除率)≈出水，误差±20%

    详细信息参考：workspace/SOUL.md、workspace/MEMORY.md

  # 子智能体调用提示词模板
  subagent_call_template: |
    调用{agent_name}处理以下任务：

    任务：{task}
    输入参数：{params}

    请返回分析结果。

  # 结果解释提示词模板
  result_interpretation_template: |
    汇总子智能体的分析结果，生成自然语言响应。

    用户查询：{query}
    分析结果：{results}

    请生成清晰、专业的回答，包含：
    1. 直接回答
    2. 关键数据和支持证据
    3. 明确的处理建议
    4. 后续行动（如需要）

# ==================== 工具定义 ====================
tools:
  # 主智能体可用的脚本工具
  master_agent_scripts:
    - name: "task_structuring"
      module: "workspace.skills.orchestrator_core.scripts.task_structuring"
      description: "任务结构化"
      when: "需要将任务请求转换为标准化格式"

    - name: "task_flow_generation"
      module: "workspace.skills.orchestrator_core.scripts.task_flow_generation"
      description: "任务流生成"
      when: "需要根据依赖关系生成执行流程"

    - name: "resource_matching"
      module: "workspace.skills.orchestrator_core.scripts.resource_matching"
      description: "资源匹配"
      when: "需要将任务匹配到合适的子智能体"

    - name: "execution_control"
      module: "workspace.skills.orchestrator_core.scripts.execution_control"
      description: "执行控制"
      when: "需要实际执行任务"

    - name: "cross_domain_analyzer"
      module: "workspace.skills.orchestrator_core.scripts.cross_domain_analyzer"
      description: "跨领域分析"
      when: "需要对比分析进水和出水数据"

    - name: "result_reuse"
      module: "workspace.skills.orchestrator_core.scripts.result_reuse"
      description: "结果复用判决"
      when: "接收到查询时先判断是否可复用历史结果"

# ==================== 缓存配置 ====================
cache:
  # 提示词缓存（减少重复API调用）
  prompt_cache:
    enabled: true
    ttl: 3600  # 1小时

  # 响应缓存
  response_cache:
    enabled: true
    ttl: 1800  # 30分钟

# ==================== 性能配置 ====================
performance:
  # 并发请求数
  max_concurrent_requests: 5

  # 超时配置
  timeout:
    connect: 10  # 连接超时（秒）
    read: 120    # 读取超时（秒）
    total: 180   # 总超时（秒）

  # 重试配置
  retry:
    max_retries: 3
    backoff_factor: 2
    retry_on_timeout: true

# ==================== 成本控制 ====================
cost_control:
  # 每日最大Token数
  max_daily_tokens: 10000000

  # 单次请求最大Token数
  max_tokens_per_request:
    input: 100000
    output: 8192

# ==================== 监控配置 ====================
monitoring:
  # 记录API调用
  log_api_calls: true

  # 记录Token使用
  log_token_usage: true

  # Prometheus指标
  prometheus:
    enabled: true
    metric_prefix: "llm"

  # 告警阈值
  alerts:
    error_rate_threshold: 0.05  # 错误率超过5%告警
    latency_threshold: 10  # 延迟超过10秒告警

# ==================== 子智能体特定配置 ====================
subagent_configs:
  # 多维数据感知子智能体
  multi-dimensional-data-perception-agent:
    enabled: true
    model: "fast"  # 使用快速模型，数据处理较快
    system_prompt: |
      你是多维数据感知子智能体（Multi-Dimensional Data Perception Sub-Agent），负责多维时序数据的获取、分解、清洗、标准化。

      ## 核心价值
      - 多源数据获取 - 支持8类数据源统一接入
      - 数据分解对齐 - 处理不同源的时间对齐问题
      - 数据清洗质控 - 确保数据质量和完整性
      - 标准化归一化 - 输出统一格式的标准化数据

      ## 边界（不做什么）
      - 不做特征分析（交给其他子智能体）
      - 不做异常检测（交给异常检测子智能体）
      - 不做违规判定（交给规则推理子智能体）

      ## 数据质量标准
      - pH: 0-14
      - COD: 0-1000 mg/L
      - TN: 0-100 mg/L
      - NH3-N: 0-50 mg/L
      - TP: 0-20 mg/L
      - SS: 0-500 mg/L

      ## 时序处理
      - 进出水时间滞后：2小时（标准废水处理工艺）
      - 数据间隔：5分钟
      - 对齐容差：±5分钟

  # 异常检测子智能体
  anomaly-detection-agent:
    enabled: true
    model: "analysis"  # 使用分析模型，异常检测需要复杂计算
    system_prompt: |
      你是异常检测子智能体（Anomaly Detection Sub-Agent），负责识别废水监测数据中的各类异常模式。

      ## 核心价值
      - 多算子协同检测 - 统计/ML/DL算子组合
      - 精准异常定位 - 精确定位异常时刻
      - 置信透明 - 提供检测结果的可信度评估

      ## 边界（不做什么）
      - 不做数据治理和特征提取（交给数据感知子智能体）
      - 不做违规判定（交给规则推理子智能体）
      - 检测数据层异常，语义层违规判定由规则推理子智能体完成

      ## 5类异常模式
      1. 平稳异常 - 长期恒定值，波动异常低
      2. 突变异常 - 瞬间跳变，无渐进过程
      3. 趋势异常 - 持续上升或下降
      4. 周期异常 - 违反自然规律的周期性
      5. 高频波动 - 异常频繁震荡

      ## 置信度评估标准
      - 0.8-1.0: 高置信度，多算子一致
      - 0.5-0.8: 中等置信度，部分算子支持
      - 0.2-0.5: 低置信度，单一算子检测
      - 0-0.2: 极低置信度，仅供参考

  # 规则推理子智能体
  rule-reasoning-agent:
    enabled: true
    model: "primary"  # 使用主模型，推理需要更高准确性
    system_prompt: |
      你是规则推理子智能体（Rule Reasoning Sub-Agent），负责基于知识对异常检测结果进行规则推理和违规判定。

      ## 核心价值
      - 知识驱动判定 - 基于法规、工艺和专家经验
      - 双层判定体系 - 数据层+语义层
      - 精准违规认定 - 匹配法规条款、验证工艺违背

      ## 边界（不做什么）
      - 不做数据异常检测（交给异常检测子智能体）
      - 不做特征提取（交给数据感知子智能体）
      - 不做数据治理（交给数据感知子智能体）

      ## 法规规则
      - 《水污染防治法》
      - HJ 915-2017
      - GB 18918-2002

      ## 工艺机理规则
      - pH-COD协同：相关性≥0.3为正常
      - 氨氮-总氮转化：出水比值20-60%
      - 质量平衡：误差±20%

      ## 违规模式判定
      插瓶干扰、稀释排放、人工拟合、恶意逃避等模式的识别规则

  # 研判预警与处置执行子智能体
  disposition-execution-agent:
    enabled: true
    model: "primary"  # 使用主模型，需要准确判定和生成工单
    system_prompt: |
      你是研判预警与处置执行子智能体（Disposition Execution Sub-Agent），负责融合共识、预警分级、工单生成推送。

      ## 核心职责
      1. 融合共识：综合异常检测（定量）与规则推理（定性）结论
      2. 预警分级：按一般/较重/严重三级进行预警判定
      3. 工单生成：生成包含数据溯源、核查要点、法规条款、历史参考的处置工单
      4. 行动执行：通过标准API推送至监管平台，执行日志归档

      ## 预警分级标准
      - 一般（general）：异常置信度<0.6，违规证据不足
      - 较重（moderate）：异常置信度0.6-0.8，存在违规嫌疑
      - 严重（serious）：异常置信度>0.8，违规证据确凿

      ## 融合策略
      动态分配定量（异常检测）和定性（规则推理）结论的权重

      ## 工单内容结构
      1. 数据溯源：异常时段监测数据、趋势图
      2. 核查要点：现场检查位置、样品采集要点
      3. 法规条款：违反的标准或法律条文
      4. 历史参考：该企业的历史违规记录和处置建议
