# 配置验证规则
# 用于验证 config.v2.yaml 的配置值是否合法

# ========== 系统基础信息验证 ==========
system:
  required_fields:
    - version
    - environment

  validation_rules:
    version:
      type: "string"
      pattern: "^\\d+\\.\\d+\\.\\d+$"
      error_message: "版本号格式应为 x.y.z"

    environment:
      type: "string"
      allowed_values: ["development", "testing", "production"]
      error_message: "环境必须是 development, testing 或 production"

# ========== 主智能体配置验证 ==========
master_agent:
  validation_rules:
    enabled:
      type: "boolean"
      error_message: "enabled 必须是布尔值"

    result_reuse:
      jaccard_threshold:
        type: "float"
        min_value: 0.0
        max_value: 1.0
        error_message: "Jaccard阈值必须在 0-1 之间"

      semantic_threshold:
        type: "float"
        min_value: 0.0
        max_value: 1.0
        error_message: "语义相似度阈值必须在 0-1 之间"

      time_overlap_threshold:
        type: "float"
        min_value: 0.0
        max_value: 1.0
        error_message: "时间重叠度阈值必须在 0-1 之间"

      max_cache_size:
        type: "integer"
        min_value: 1
        max_value: 10000
        error_message: "最大缓存大小必须在 1-10000 之间"

      cache_ttl:
        type: "integer"
        min_value: 60
        max_value: 86400
        error_message: "缓存过期时间必须在 60-86400 秒之间"

    task_processing:
      max_concurrent_tasks:
        type: "integer"
        min_value: 1
        max_value: 100
        error_message: "最大并发任务数必须在 1-100 之间"

      task_timeout:
        type: "integer"
        min_value: 10
        max_value: 3600
        error_message: "任务超时时间必须在 10-3600 秒之间"

    llm:
      model:
        type: "string"
        allowed_values: ["claude-opus-4-7", "claude-sonnet-4-6", "claude-haiku-4-5"]
        error_message: "模型必须是支持的 Claude 模型"

      temperature:
        type: "float"
        min_value: 0.0
        max_value: 1.0
        error_message: "温度参数必须在 0-1 之间"

      max_tokens:
        type: "integer"
        min_value: 1
        max_value: 128000
        error_message: "最大 token 数必须在 1-128000 之间"

# ========== 任务编排层配置验证 ==========
task_orchestration:
  validation_rules:
    concurrency:
      max_parallel_tasks:
        type: "integer"
        min_value: 1
        max_value: 50
        error_message: "最大并行任务数必须在 1-50 之间"

    timeout:
      default:
        type: "integer"
        min_value: 5
        max_value: 600
        error_message: "默认超时时间必须在 5-600 秒之间"

    retry:
      max_retries:
        type: "integer"
        min_value: 0
        max_value: 10
        error_message: "最大重试次数必须在 0-10 之间"

      backoff_factor:
        type: "float"
        min_value: 1.0
        max_value: 10.0
        error_message: "退避因子必须在 1.0-10.0 之间"

# ========== 子智能体配置验证 ==========
subagents:
  # 通用验证规则（适用于所有子智能体）
  common_rules:
    enabled:
      type: "boolean"
      error_message: "enabled 必须是布尔值"

    priority:
      type: "integer"
      min_value: 1
      max_value: 10
      error_message: "优先级必须在 1-10 之间"

    timeout:
      type: "integer"
      min_value: 10
      max_value: 600
      error_message: "超时时间必须在 10-600 秒之间"

    version:
      type: "string"
      pattern: "^\\d+\\.\\d+\\.\\d+$"
      error_message: "版本号格式应为 x.y.z"

  # 数据治理子智能体特定规则
  data_governance_agent:
    config:
      processing:
        max_data_size:
          type: "integer"
          min_value: 1000
          max_value: 100000000
          error_message: "最大数据大小必须在 1000-100000000 之间"

        batch_size:
          type: "integer"
          min_value: 10
          max_value: 100000
          error_message: "批处理大小必须在 10-100000 之间"

  # 特征分析子智能体特定规则
  feature_analysis_agent:
    config:
      feature_extraction:
        window_size:
          type: "integer"
          min_value: 5
          max_value: 1000
          error_message: "窗口大小必须在 5-1000 之间"

      correlation:
        threshold:
          type: "float"
          min_value: 0.0
          max_value: 1.0
          error_message: "相关性阈值必须在 0-1 之间"

  # 异常检测子智能体特定规则
  anomaly_detection_agent:
    config:
      algorithms:
        isolation_forest:
          contamination:
            type: "float"
            min_value: 0.0
            max_value: 0.5
            error_message: "污染参数必须在 0-0.5 之间"

        one_class_svm:
          nu:
            type: "float"
            min_value: 0.0
            max_value: 1.0
            error_message: "nu 参数必须在 0-1 之间"

      patterns:
        constant:
          min_duration_hours:
            type: "integer"
            min_value: 1
            max_value: 24
            error_message: "最小持续时长必须在 1-24 小时之间"

        spike:
          threshold_multiplier:
            type: "float"
            min_value: 1.0
            max_value: 10.0
            error_message: "阈值倍数必须在 1.0-10.0 之间"

      thresholds:
        critical:
          type: "float"
          min_value: 0.0
          max_value: 1.0
          error_message: "严重异常阈值必须在 0-1 之间"

        high:
          type: "float"
          min_value: 0.0
          max_value: 1.0
          error_message: "高度异常阈值必须在 0-1 之间"

        medium:
          type: "float"
          min_value: 0.0
          max_value: 1.0
          error_message: "中度异常阈值必须在 0-1 之间"

        low:
          type: "float"
          min_value: 0.0
          max_value: 1.0
          error_message: "低度异常阈值必须在 0-1 之间"

  # 规则推理子智能体特定规则
  rule_reasoning_agent:
    config:
      process_mechanism:
        ph_cod_correlation:
          min_correlation:
            type: "float"
            min_value: -1.0
            max_value: 1.0
            error_message: "相关系数必须在 -1 到 1 之间"

        nitrogen_conversion:
          min_correlation:
            type: "float"
            min_value: -1.0
            max_value: 1.0
            error_message: "相关系数必须在 -1 到 1 之间"

          nh3_tn_ratio_min:
            type: "float"
            min_value: 0.0
            max_value: 1.0
            error_message: "氨氮/总氮比值下限必须在 0-1 之间"

          nh3_tn_ratio_max:
            type: "float"
            min_value: 0.0
            max_value: 1.0
            error_message: "氨氮/总氮比值上限必须在 0-1 之间"

      expert_experience:
        similarity_threshold:
          type: "float"
          min_value: 0.0
          max_value: 1.0
          error_message: "相似度阈值必须在 0-1 之间"

# ========== 数据源配置验证 ==========
data_sources:
  csv:
    path:
      type: "string"
      error_message: "CSV 路径必须是字符串"

  api:
    timeout:
      type: "integer"
      min_value: 1
      max_value: 300
      error_message: "API 超时时间必须在 1-300 秒之间"

  stream:
    port:
      type: "integer"
      min_value: 1024
      max_value: 65535
      error_message: "端口号必须在 1024-65535 之间"

# ========== 缓存配置验证 ==========
cache:
  type:
    allowed_values: ["file", "redis", "memory"]
    error_message: "缓存类型必须是 file, redis 或 memory"

  file:
    max_size_mb:
      type: "integer"
      min_value: 1
      max_value: 10240
      error_message: "最大缓存大小必须在 1-10240 MB 之间"

    ttl:
      type: "integer"
      min_value: 60
      max_value: 86400
      error_message: "缓存过期时间必须在 60-86400 秒之间"

  redis:
    port:
      type: "integer"
      min_value: 1
      max_value: 65535
      error_message: "Redis 端口号必须在 1-65535 之间"

# ========== 日志配置验证 ==========
logging:
  level:
    allowed_values: ["DEBUG", "INFO", "WARNING", "ERROR"]
    error_message: "日志级别必须是 DEBUG, INFO, WARNING 或 ERROR"

  file:
    max_size_mb:
      type: "integer"
      min_value: 1
      max_value: 1000
      error_message: "日志文件最大大小必须在 1-1000 MB 之间"

    backup_count:
      type: "integer"
      min_value: 1
      max_value: 100
      error_message: "备份数量必须在 1-100 之间"

# ========== 监控配置验证 ==========
monitoring:
  prometheus:
    port:
      type: "integer"
      min_value: 1024
      max_value: 65535
      error_message: "Prometheus 端口号必须在 1024-65535 之间"

    scrape_interval:
      type: "integer"
      min_value: 1
      max_value: 3600
      error_message: "抓取间隔必须在 1-3600 秒之间"

  grafana:
    port:
      type: "integer"
      min_value: 1024
      max_value: 65535
      error_message: "Grafana 端口号必须在 1024-65535 之间"

# ========== API配置验证 ==========
api:
  host:
    type: "string"
    error_message: "主机地址必须是字符串"

  port:
    type: "integer"
    min_value: 1024
    max_value: 65535
    error_message: "API 端口号必须在 1024-65535 之间"

  debug:
    type: "boolean"
    error_message: "debug 模式必须是布尔值"

# ========== 状态管理配置验证 ==========
state_management:
  persistence:
    interval:
      type: "integer"
      min_value: 60
      max_value: 3600
      error_message: "持久化间隔必须在 60-3600 秒之间"

  sync:
    heartbeat_interval:
      type: "integer"
      min_value: 10
      max_value: 300
      error_message: "心跳间隔必须在 10-300 秒之间"

    timeout_threshold:
      type: "integer"
      min_value: 30
      max_value: 600
      error_message: "超时阈值必须在 30-600 秒之间"
