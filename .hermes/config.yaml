hermes:
  version: "1.0"

model:
  provider: anthropic
  model: claude-sonnet-4-20250514

workspace:
  path: ./workspace

subagents:
  path: ./subagents
  auto_approve: false

memory:
  enabled: true
  provider: builtin
  path: ./workspace/MEMORY.md

tools:
  enabled:
    - multi_dimensional_data_perception
    - anomaly_detection
    - rule_reasoning
    - disposition_execution

delegation:
  max_concurrent_children: 4
  max_spawn_depth: 1

logging:
  level: INFO
  file: logs/hermes.log
