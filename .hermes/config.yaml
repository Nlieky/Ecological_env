# Hermes Agent Framework Configuration
# 废水监测系统 - 主智能体配置

hermes:
  version: "1.0"

# LLM 配置 - 支持自定义服务器
model:
  provider: custom  # 使用自定义服务器
  base_url_env: LLM_BASE_URL  # 从环境变量读取服务器地址
  api_key_env: LLM_API_KEY     # 从环境变量读取 API 密钥
  model_env: LLM_MODEL         # 从环境变量读取模型名称
  # 默认值（如果环境变量未设置）
  base_url: "https://api.longcat.chat/openai/v1"
  model: "LongCat-2.0"  # 美团 LongCat 模型
  temperature: 0.7
  max_tokens: 4096

# 备用配置：如果使用 OpenAI 兼容格式
# model:
#   provider: openai_compatible
#   base_url: "http://172.16.12.41:30000/v1"
#   api_key: "your-api-key"
#   model: "ctgu-vlm"

# 工具配置 - 4个子智能体作为工具
tools:
  enabled:
    - multi_dimensional_data_perception
    - anomaly_detection
    - rule_reasoning
    - disposition_execution

# 子智能体配置
delegation:
  max_concurrent_children: 4
  subagent_auto_approve: false  # 安全模式，需要人工确认
  timeout: 300  # 子智能体超时时间（秒）

# 内存配置
memory:
  enabled: true
  provider: local
  max_entries: 1000
  retention_days: 30

# 技能配置
skills:
  # 外部技能目录 - 4个子智能体的 skills
  external_dirs:
    - subagents/multi-dimensional-data-perception-agent/skills
    - subagents/anomaly-detection-agent/skills
    - subagents/rule-reasoning-agent/skills
    - subagents/disposition-execution-agent/skills

# 日志配置
logging:
  level: INFO
  file: logs/hermes.log
  rotation: daily
