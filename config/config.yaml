# 废水监测多智能体系统 - 主配置文件

# ==================== 数据源配置 ====================
data_source:
  raw_data_dir: "E:/project/Ecological_env/data"
  processed_data_dir: "data/processed"
  reference_data_dir: "data/reference"

  # 数据文件（完整路径）
  influent_file: "E:/project/Ecological_env/data/pollution_water_in.csv"
  effluent_file: "E:/project/Ecological_env/data/pollution_water_out.csv"

  # 数据参数
  time_column: "监测时间"
  time_granularity: "hourly"  # hourly, daily, weekly, monthly

# ==================== 数据流配置 ====================
stream:
  enabled: true
  speed_factor: 60  # 1=实时, 60=1分钟模拟1小时
  infinite_loop: true
  inject_anomalies: false  # 测试用
  batch_size: 1  # 每次处理的记录数

# ==================== 智能体配置 ====================
agents:
  data_perception:
    enabled: true
    cache_size: 1000
    quality_threshold: 0.8

  feature_analysis:
    enabled: false  # TODO: 实现后启用
    model_path: "models/ae_anomaly_detector.pkl"

  mechanism_rule:
    enabled: false  # TODO: 实现后启用

  interaction:
    enabled: false  # TODO: 实现后启用

  collaborative_decision:
    enabled: false  # TODO: 实现后启用

# ==================== Skills配置 ====================
skills:
  data_preprocessing:
    enabled: true
    handle_missing: true
    handle_outliers: true

  quality_check:
    enabled: true
    strict_mode: false

  feature_extraction:
    enabled: true
    extract_statistical: true
    extract_temporal: true
    extract_behavioral: true

  anomaly_detection:
    enabled: true
    method: "statistical"  # statistical, model_based

  forgery_detection:
    enabled: true
    bottle_variance_threshold: 0.1
    stealth_correlation_threshold: 0.7

  llm_decision:
    enabled: true
    model: "claude-3-5-sonnet-20241022"
    max_tokens: 2000
    api_key_env: "ANTHROPIC_API_KEY"

# ==================== 模型配置 ====================
models:
  autoencoder:
    input_dim: 8
    hidden_dim: 64
    latent_dim: 32
    dropout: 0.2
    epochs: 100
    batch_size: 32

  forgery_detector:
    statistical_window: 24
    variance_threshold: 0.1
    correlation_threshold: 0.7

# ==================== 法规标准配置 ====================
regulations:
  总排口:
    pH值: {min: 6, max: 9}
    化学需氧量浓度（毫克/升）: {max: 30}
    总氮浓度（毫克/升）: {max: 10}
    氨氮浓度（毫克/升）: {max: 1.5}
    总磷浓度（毫克/升）: {max: 0.3}

  进水口:
    pH值: {min: 1, max: 14}
    化学需氧量浓度（毫克/升）: {max: 1500}
    总氮浓度（毫克/升）: {max: 50}
    氨氮浓度（毫克/升）: {max: 120}
    总磷浓度（毫克/升）: {max: 5}

# ==================== API配置 ====================
api:
  host: "0.0.0.0"
  port: 5000
  debug: true

  endpoints:
    stream: "/api/data/stream"
    analyze: "/api/alert/analyze"
    metrics: "/metrics"
    health: "/health"

# ==================== 外部服务配置 ====================
external_services:
  anthropic:
    api_key_env: "ANTHROPIC_API_KEY"
    model: "claude-3-5-sonnet-20241022"
    timeout: 10
    max_retries: 3

  feishu:
    webhook_url: "https://open.feishu.cn/open-apis/bot/v2/hook/ada47b7c-11f9-4407-920e-376abb81da01"
    timeout: 5

  prometheus:
    enabled: true
    port: 9090
    metric_path: "/metrics"

  grafana:
    enabled: false  # 需要手动配置
    url: "http://localhost:3000"
    dashboard_dir: "grafana/dashboards"

# ==================== 日志配置 ====================
logging:
  level: "INFO"
  format: "%(asctime)s [%(levelname)s] %(message)s"
  file:
    enabled: true
    path: "logs/app.log"
    max_bytes: 10485760  # 10MB
    backup_count: 5
  console:
    enabled: true

# ==================== 监控配置 ====================
monitoring:
  prometheus:
    enabled: true

  metrics:
    data_stream_processed: "counter"
    anomaly_detected: "counter"
    forgery_detected: "counter"
    processing_time: "histogram"
    llm_decision_time: "histogram"

# ==================== 开发配置 ====================
development:
  test_mode: true
  save_intermediate_results: true
  mock_llm: false  # 测试时可以模拟LLM响应
