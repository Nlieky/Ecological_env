# Prometheus 配置 — 抓取 FastAPI 后端 :8000/metrics（新版本；不再用旧的 :5000 Flask 中间件）
# 启动：D:\prometheus-3.10.0.windows-amd64\prometheus-3.10.0.windows-amd64\prometheus.exe --config.file=grafana\prometheus.yml
global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'wastewater'
    metrics_path: /metrics
    static_configs:
      - targets: ['localhost:8000']
