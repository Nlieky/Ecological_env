# 全局配置
global:
  scrape_interval: 5s        # 5秒采集一次指标
  evaluation_interval: 5s    # 5秒评估一次告警规则

# 对接Alertmanager（如果还没装Alertmanager，先保留这部分）
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['localhost:9093']  # Alertmanager默认端口

# 关键：指定告警规则文件路径（你的rules.yml位置）
rule_files:
  - "./rules.yml"  # 和prometheus.yml同目录，用相对路径

# 采集Windows Exporter指标
scrape_configs:
  # 采集Windows系统指标
  - job_name: "windows-exporter"
    static_configs:
      - targets: ["localhost:9182"]  # Windows Exporter默认端口

  # 可选：采集Prometheus自身指标
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # 采集废水监测系统指标
  - job_name: 'wastewater_monitoring'
    static_configs:
      - targets: ['localhost:5000']  # Flask服务器地址
        labels:
          app: 'wastewater_system'
          env: 'development'